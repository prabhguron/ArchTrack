<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <link rel="stylesheet" href="./design/styles.css">

  <script defer src="./design/index.js"></script> <!-- add `defer` attribute -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Bootstrap JS -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>


  
  <title>Frontend Mentor | Time tracking dashboard</title>


</head>


<!-- Modal -->
<div id="projectModal" class="modal fade" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title">Add New Project</h4>
      </div>
      <div class="modal-body">
        <form id="projectForm">
            <label for="projectName">projects name:</label>
            <input type="text" id="projectName" name="fname"><br><br>
            <label for="projectHours">hours</label>
            <input type="number" id="projectHours" name="lname"><br><br>
            <label for="projectPhoto">picture</label>
            <input type="file" id="projectPhoto" name="photo" accept="image/*">
            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
              <button type="submit" value="Submit" id="buttonAccept" class="btn btn-primary">Add Project</button>
            </div>
        </form>
      </div>

    </div>
  </div>
</div>


<body>

<h1 id="title">ArchTracker</h1>

<div class="stats-card">
  <div class="chart-container">
    <canvas id="projectChart"></canvas>
    <div class="chart-total">
    </div>
  </div>
</div>
</div>

<div class="container">

</div>
<div class="btns">
  <button class="button" id="addProject" data-toggle="modal" data-target="#projectModal">add a project</button>
  <button class="button" id="deleteProject">delete project</button>

</div>

</body>
</html>
